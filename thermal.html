<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEEMI Thermal Review</title>
<style>
:root{
  --ground:#f4f6f5; --panel:#ffffff; --line:#d5dedd;
  --ink:#10191c; --ink2:#42535a; --mut:#6d8088;
  --person:#c4551f; --accent:#0f7d8a;
  --stage:#05090b;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0d1418; --panel:#141e23; --line:#22323a;
  --ink:#e7eeed; --ink2:#b3c2c5; --mut:#7e9199;
  --person:#f0834a; --accent:#3fc0cd;
}}
:root[data-theme="dark"]{
  --ground:#0d1418; --panel:#141e23; --line:#22323a;
  --ink:#e7eeed; --ink2:#b3c2c5; --mut:#7e9199;
  --person:#f0834a; --accent:#3fc0cd;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:15px/1.45 var(--ui);
  display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding:18px 24px 12px;flex-wrap:wrap}
.htext{display:flex;flex-direction:column;gap:5px}
.eyebrow{font:600 11px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-size:26px;line-height:1.15;letter-spacing:-.022em;font-weight:680}
.byline{margin:0;color:var(--mut);font-size:13.5px}
.seg{display:inline-flex;background:var(--line);border-radius:9px;padding:2px}
.seg a{font-size:13px;padding:5px 13px;border-radius:7px;color:var(--ink2);text-decoration:none;
  white-space:nowrap}
.seg a.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.note{padding:0 24px 10px;color:var(--mut);font-size:13px}
.note b{color:var(--ink2);font-weight:550}
.stage{flex:1;min-height:0;display:flex;gap:10px;padding:0 24px;position:relative}
.pane{flex:1;position:relative;overflow:hidden;background:var(--stage);border-radius:12px;
  touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.pane.rgb{flex:1.25}
.pane.drag{cursor:grabbing}
.stage.mark .pane{cursor:crosshair}
.pane img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;pointer-events:none}
.pane svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.plabel{position:absolute;left:10px;top:10px;z-index:2;font-size:12px;color:rgba(255,255,255,.88);
  background:rgba(20,20,22,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:3px 9px;border-radius:7px;pointer-events:none}
.plabel span{color:rgba(235,235,245,.55);font-family:var(--mono);font-size:11px;margin-left:6px}
.geopill{position:absolute;z-index:5;display:none;align-items:baseline;gap:8px;
  font:500 13px var(--ui);color:#fff;background:rgba(28,28,30,.72);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  padding:6px 11px;border-radius:10px;white-space:nowrap;cursor:pointer;
  box-shadow:0 4px 18px rgba(0,0,0,.35);transform:translate(-50%,-100%) translateY(-10px)}
.geopill.on{display:inline-flex}
.geopill .sub{color:rgba(235,235,245,.6);font-weight:400}
.tools{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:6;display:flex;gap:2px;
  background:rgba(28,28,30,.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:3px;border-radius:12px}
.tools button{display:flex;align-items:center;gap:6px;border:0;border-radius:9px;background:none;
  color:rgba(255,255,255,.75);font:500 13px var(--ui);padding:6px 12px;cursor:pointer}
.tools button.on{background:rgba(255,255,255,.16);color:#fff}
.tools svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.strip{display:flex;gap:6px;overflow-x:auto;padding:12px 24px 16px;scrollbar-width:thin}
.strip button{flex:none;position:relative;border:0;padding:0;border-radius:7px;overflow:hidden;
  cursor:pointer;opacity:.55;outline:2px solid transparent;outline-offset:-2px;background:none}
.strip button.on{opacity:1;outline-color:var(--accent)}
.strip button:hover{opacity:.9}
.strip img{display:block;width:84px;height:63px;object-fit:cover}
.strip i{position:absolute;right:5px;top:5px;width:7px;height:7px;border-radius:50%;
  background:var(--person);box-shadow:0 0 0 1.5px rgba(0,0,0,.4)}
.legend{display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--mut)}
.legend s{display:inline-block;width:14px;height:10px;border:1.5px solid var(--person);
  border-radius:2px;vertical-align:-1px;margin-right:5px;text-decoration:none}
.legend s.u{border-color:var(--ink2)}
.legend s.d{border-style:dashed}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:9;font-size:13px;
  background:rgba(28,28,30,.85);color:#fff;padding:7px 14px;border-radius:10px;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:760px){
  body{overflow:auto;height:auto}
  header,.note{padding-left:16px;padding-right:16px}
  .stage{flex-direction:column;padding:0 16px;flex:none}
  .pane,.pane.rgb{flex:none;height:44vh}
  .strip{padding-left:16px;padding-right:16px}
  .legend{display:none}
}
</style></head><body>

const GSIG={"gps_m": 3.5, "yaw_deg": 3.5, "pitch_deg": 2.625, "roll_deg": 1.75, "alt_m": 1.75, "terrain_m": 5.25}, GMIN=8.0;
function gRay(p,u,v,dy,dp,dr){
  const yaw=(p.yaw+dy)*Math.PI/180, pit=(p.pitch+dp)*Math.PI/180, rol=(p.roll+dr)*Math.PI/180;
  const f=[Math.cos(pit)*Math.cos(yaw),Math.cos(pit)*Math.sin(yaw),-Math.sin(pit)];
  let r=[-Math.sin(yaw),Math.cos(yaw),0];
  let d=[f[1]*r[2]-f[2]*r[1],f[2]*r[0]-f[0]*r[2],f[0]*r[1]-f[1]*r[0]];
  if(rol){const c=Math.cos(rol),s=Math.sin(rol);
    const r2=r.map((a,k)=>c*a+s*d[k]), d2=r.map((a,k)=>-s*a+c*d[k]); r=r2; d=d2;}
  const a=(u-p.cx)/p.fx, b=(v-p.cy)/p.fx;
  const q=[0,1,2].map(k=>f[k]+a*r[k]+b*d[k]); const n=Math.hypot(...q);
  return q.map(x=>x/n);
}
function gGround(p,u,v,dy=0,dp=0,dr=0,da=0,dt=0){
  const r=gRay(p,u,v,dy,dp,dr);
  if(r[2]<=Math.sin(GMIN*Math.PI/180)) return null;
  const h=p.alt+da-dt; if(h<=0) return null;
  const t=h/r[2]; return [r[0]*t,r[1]*t];
}
function gRng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;
  t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}
function gGauss(rnd){const u=Math.max(1e-12,rnd()),v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function geoLocate(p,b){
  if(!p) return {error:"photo lacks GPS/altitude/gimbal metadata"};
  const u=(b[0]+b[2])/2, v=p.pitch>-75?b[3]:(b[1]+b[3])/2;
  const g=gGround(p,u,v);
  if(!g) return {error:"too close to the horizon to place"};
  const R=6378137, lat=p.lat+g[0]/R*180/Math.PI,
        lon=p.lon+g[1]/(R*Math.cos(p.lat*Math.PI/180))*180/Math.PI;
  const rnd=gRng(1+Math.round(u)*7919+Math.round(v)), miss=[];
  for(let i=0;i<300;i++){
    const gs=gGround(p,u,v,gGauss(rnd)*GSIG.yaw_deg,gGauss(rnd)*GSIG.pitch_deg,
      gGauss(rnd)*GSIG.roll_deg,gGauss(rnd)*GSIG.alt_m,gGauss(rnd)*GSIG.terrain_m);
    if(!gs){miss.push(Infinity);continue}
    miss.push(Math.hypot(gs[0]-g[0]+gGauss(rnd)*GSIG.gps_m, gs[1]-g[1]+gGauss(rnd)*GSIG.gps_m));
  }
  miss.sort((a,b)=>a-b); const r90=miss[Math.floor(0.9*miss.length)];
  if(!isFinite(r90)) return {error:"too close to the horizon to place"};
  return {lat, lon, radius_m:r90, range_m:Math.hypot(g[0],g[1])};
}
async function locateBox(r,b){ return geoLocate(r.pose,b); }

function fit(k){const r=P[k].el.getBoundingClientRect(),[w,h]=dims(k),s=fitS(k);
  P[k].v={s,tx:(r.width-w*s)/2,ty:(r.height-h*s)/2}}
function apply(k){const {s,tx,ty}=P[k].v;P[k].img.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;draw(k)}
function clampS(k,s){const f=fitS(k);return Math.max(f*.8,Math.min(f*(k==="rgb"?60:14),s))}
function zoomAt(k,mx,my,f){const v=P[k].v,s=clampS(k,v.s*f),q=s/v.s;
  v.tx=mx-(mx-v.tx)*q;v.ty=my-(my-v.ty)*q;v.s=s;apply(k)}
function focus(k,b,ms=320){ // fly pane k to an rgb box
  const pb=inPane(k,b),r=P[k].el.getBoundingClientRect(),
        bw=Math.max(pb[2]-pb[0],k==="rgb"?40:5),bh=Math.max(pb[3]-pb[1],k==="rgb"?40:5);
  const s=clampS(k,Math.min(r.width/(bw*9),r.height/(bh*9))),
        cx=(pb[0]+pb[2])/2,cy=(pb[1]+pb[3])/2,
        to={s,tx:r.width/2-cx*s,ty:r.height/2-cy*s},from={...P[k].v},t0=performance.now();
  const ease=t=>1-Math.pow(1-t,3);
  (function step(now){const t=Math.min(1,(now-t0)/ms),e=ease(t);
    for(const q of ["s","tx","ty"]) P[k].v[q]=from[q]+(to[q]-from[q])*e;
    apply(k); if(t<1) requestAnimationFrame(step); else placePill();})(t0);
}

// ---- drawing
function rect(k,b,cls){const v=P[k].v,pb=inPane(k,b);
  const x=pb[0]*v.s+v.tx,y=pb[1]*v.s+v.ty,w=Math.max(4,(pb[2]-pb[0])*v.s),h=Math.max(4,(pb[3]-pb[1])*v.s);
  return {x,y,w,h,svg:`<rect x="${x-2}" y="${y-2}" width="${w+4}" height="${h+4}" rx="3" ${cls}/>`}}
function allBoxes(){
  return d().boxes.map((m,i)=>({id:"m"+i,b:[m[1],m[2],m[1]+m[3],m[2]+m[4]],model:m}))
    .concat(USER.map((u,i)=>({id:"u"+i,b:u.b,user:u})))}
function draw(k){
  const out=[], person=getComputedStyle(document.documentElement).getPropertyValue("--person").trim()||"#f0834a";
  if(k==="rgb"){ // thermal footprint
    const c=[[0,0],[TW,0],[TW,TH],[0,TH]].map(p=>t2r(...p)),v=P.rgb.v;
    out.push(`<polygon points="${c.map(p=>`${p[0]*v.s+v.tx},${p[1]*v.s+v.ty}`).join(" ")}"
      fill="none" stroke="rgba(255,255,255,.28)" stroke-dasharray="5 5" stroke-width="1"/>`)}
  for(const o of allBoxes()){
    const own=o.user?o.user.pane===k:(o.model[5]==="thermal"?k==="th":o.model[5]==="rgb"?k==="rgb":true);
    if(!o.user&&!own&&!onImage(k,o.b)) continue;   // its counterpart falls outside this camera's view
    const col=o.user?"#ffffff":person, hot=(SEL===o.id||HOV===o.id);
    out.push(rect(k,o.b,`fill="none" stroke="${col}" stroke-width="${hot?2.4:1.6}"
      ${own?"":'stroke-dasharray="4 3"'} opacity="${hot?1:.92}"`).svg)}
  if(DRAG&&DRAG.mark&&DRAG.k===k){const x=Math.min(DRAG.x0,DRAG.x1),y=Math.min(DRAG.y0,DRAG.y1);
    out.push(`<rect x="${x}" y="${y}" width="${Math.abs(DRAG.x1-DRAG.x0)}" height="${Math.abs(DRAG.y1-DRAG.y0)}"
      rx="3" fill="rgba(255,255,255,.08)" stroke="#fff" stroke-width="1.6"/>`)}
  P[k].svg.innerHTML=out.join("");
}
const drawAll=()=>{draw("rgb");draw("th");placePill()};

// ---- lat/lon pill: only for the hovered or selected box
const GEO={};
function hit(k,mx,my){let best=null,ba=1e18;
  for(const o of allBoxes()){const r=rect(k,o.b,"");
    if(mx>=r.x-8&&mx<=r.x+r.w+8&&my>=r.y-8&&my<=r.y+r.h+8&&r.w*r.h<ba){best=o.id;ba=r.w*r.h}}
  return best}
let PILLK="rgb";
function placePill(){
  const id=HOV||SEL, o=id&&allBoxes().find(x=>x.id===id);
  if(!o){pill.classList.remove("on");return}
  const k=PILLK, r=rect(k,o.b,""), pr=P[k].el.getBoundingClientRect(), sr=stage.getBoundingClientRect();
  const key=CUR+":"+o.b.map(Math.round).join(",");
  if(!(key in GEO)) GEO[key]=geoLocate(d().pose,o.b);
  const g=GEO[key];
  const src=o.model?({both:"RGB + thermal",rgb:"RGB",thermal:"thermal only"})[o.model[5]]+` · ${Math.round(o.model[0]*100)}%`:"your mark";
  pill.innerHTML=g.error?`<span class="sub">${g.error}</span>`:
    `${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}<span class="sub">±${Math.max(1,Math.round(g.radius_m))} m · ${src}</span>`;
  pill.dataset.copy=g.error?"":`${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}`;
  pill.style.left=(pr.left-sr.left+r.x+r.w/2)+"px";
  pill.style.top=(pr.top-sr.top+Math.max(34,r.y))+"px";
  pill.classList.add("on");
}
pill.onclick=()=>{if(pill.dataset.copy){navigator.clipboard?.writeText(pill.dataset.copy);toast("Copied "+pill.dataset.copy)}};
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");
  clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1400)}

// ---- pointer handling
let DRAG=null;
for(const k of ["rgb","th"]){
  const el=P[k].el, loc=e=>{const r=el.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  el.addEventListener("wheel",e=>{e.preventDefault();const [mx,my]=loc(e);
    zoomAt(k,mx,my,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0018)));placePill()},{passive:false});
  el.addEventListener("pointerdown",e=>{
    const [mx,my]=loc(e); el.setPointerCapture(e.pointerId);
    const mark=MODE==="mark"||e.shiftKey, h=mark?null:hit(k,mx,my);
    DRAG={k,mark,x0:mx,y0:my,x1:mx,y1:my,v:{...P[k].v},moved:false,h};
    if(!mark) el.classList.add("drag");
  });
  el.addEventListener("pointermove",e=>{const [mx,my]=loc(e);
    if(DRAG&&DRAG.k===k){DRAG.x1=mx;DRAG.y1=my;
      if(Math.hypot(mx-DRAG.x0,my-DRAG.y0)>3) DRAG.moved=true;
      if(DRAG.mark) draw(k);
      else{P[k].v.tx=DRAG.v.tx+mx-DRAG.x0;P[k].v.ty=DRAG.v.ty+my-DRAG.y0;apply(k);placePill()}
      return}
    const h=hit(k,mx,my); if(h!==HOV){HOV=h;PILLK=k;drawAll()}
  });
  el.addEventListener("pointerleave",()=>{if(!DRAG&&HOV){HOV=null;drawAll()}});
  el.addEventListener("pointerup",()=>{
    const g=DRAG; DRAG=null; el.classList.remove("drag"); if(!g) return;
    if(g.mark){
      if(Math.abs(g.x1-g.x0)>4&&Math.abs(g.y1-g.y0)>4){
        const v=P[k].v,c=[g.x0,g.y0,g.x1,g.y1].map((q,i)=>(q-(i%2?v.ty:v.tx))/v.s);
        const b=fromPane(k,[Math.min(c[0],c[2]),Math.min(c[1],c[3]),Math.max(c[0],c[2]),Math.max(c[1],c[3])]);
        USER.push({b,pane:k}); SEL="u"+(USER.length-1); PILLK=k;
        focus(k==="rgb"?"th":"rgb",b);
      }
      drawAll(); return}
    if(!g.moved){ // click: select a box and show it on the other image
      SEL=g.h; PILLK=k; if(g.h){const o=allBoxes().find(x=>x.id===g.h);focus(k==="rgb"?"th":"rgb",o.b)}
      drawAll()}
  });
}

// ---- controls
function setMode(m){MODE=m;tmove.classList.toggle("on",m==="move");tmark.classList.toggle("on",m==="mark");
  stage.classList.toggle("mark",m==="mark")}
tmove.onclick=()=>setMode("move"); tmark.onclick=()=>setMode("mark");
tfit.onclick=()=>{fit("rgb");fit("th");apply("rgb");apply("th");placePill()};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight") show(Math.min(DATA.length-1,CUR+1));
  else if(e.key==="ArrowLeft") show(Math.max(0,CUR-1));
  else if(e.key==="m"||e.key==="M") setMode("mark");
  else if(e.key==="v"||e.key==="V") setMode("move");
  else if(e.key==="f"||e.key==="F") tfit.onclick();
  else if(e.key==="Escape"){SEL=null;drawAll()}
  else if(e.key==="Backspace"||e.key==="Delete"){
    const i=SEL&&SEL[0]==="u"?+SEL.slice(1):USER.length-1;
    if(i>=0){USER.splice(i,1);SEL=null;HOV=null;drawAll()}
    e.preventDefault()}
});

function show(i){
  CUR=i; USER=[]; SEL=null; HOV=null; const r=DATA[i];
  lrgb.textContent=r.rgb+(r.zoom>1.01?` · ${r.zoom.toFixed(2)}× zoom`:""); lth.textContent=r.th;
  let n=2; const done=()=>{if(--n===0){fit("rgb");fit("th");apply("rgb");apply("th")}};
  irgb.onload=done; ith.onload=done;
  irgb.style.width=r.W+"px"; irgb.style.height=r.H+"px"; ith.style.width=TW+"px"; ith.style.height=TH+"px";
  irgb.src=`tdemo/${r.n}_rgb.jpg`; ith.src=`tdemo/${r.n}_th.jpg`;
  pill.classList.remove("on");
  document.querySelectorAll(".strip button").forEach((b,j)=>b.classList.toggle("on",j===i));
  document.querySelector(".strip button.on")?.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  history.replaceState(null,"","#"+r.n);
  if(DATA[i+1]){new Image().src=`tdemo/${DATA[i+1].n}_rgb.jpg`}
}
strip.innerHTML=DATA.map((r,i)=>`<button title="${r.rgb}" onclick="show(${i})"><img loading="lazy" src="tdemo/${r.n}_s.jpg" alt="">${
  r.hit?"<i></i>":""}</button>`).join("");
addEventListener("resize",()=>tfit.onclick());
const h=location.hash.slice(1), start=DATA.findIndex(r=>r.n===h);
show(start>=0?start:Math.max(0,DATA.findIndex(r=>r.hit)));
</script>
</body></html>
